<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Students - School ERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        aside::-webkit-scrollbar { width: 4px; }
        aside::-webkit-scrollbar-track { background: transparent; }
        aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        main::-webkit-scrollbar { width: 6px; }
        main::-webkit-scrollbar-track { background: #f0f4f8; }
        main::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Table Row Hover Animation */
        tr { transition: background-color 0.2s ease; }
        tr:hover { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-[#f0f4f8] text-[#334e68] flex h-screen overflow-hidden antialiased">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#003126] text-white flex flex-col h-full overflow-y-auto hidden md:flex shrink-0 pb-10 shadow-xl z-20">
        <div class="p-4 flex items-center border-b border-white/10 sticky top-0 bg-[#003126] z-10">
            <div class="bg-white/10 text-[#00c3a2] p-2 rounded mr-3"><i class="fa-solid fa-school text-lg"></i></div>
            <div>
                <h1 class="text-sm font-bold leading-tight">data click education</h1>
                <p class="text-[10px] text-teal-100/70">Management System</p>
            </div>
        </div>

        <div class="p-4 flex items-center border-b border-white/10">
            <div class="w-8 h-8 rounded-full bg-teal-100 text-[#003126] flex items-center justify-center font-bold mr-3 text-sm">S</div>
            <div>
                <h2 class="text-[13px] font-semibold">Super Administrator</h2>
                <p class="text-[10px] text-yellow-400"><i class="fa-solid fa-star"></i> Super Admin</p>
            </div>
        </div>

        <nav class="flex-1 px-2 py-4 text-[12px]">
            <div class="mb-1 text-[10px] text-teal-100/50 px-2 font-bold tracking-wider">MAIN</div>
            <!-- LINKED TO DASHBOARD -->
            <a href="index.html" class="flex items-center px-2 py-2 hover:bg-white/5 rounded mb-1 text-gray-300 transition-colors"><i class="fa-solid fa-house w-6"></i> Dashboard</a>

            <div class="mt-4 mb-1 text-[10px] text-teal-100/50 px-2 font-bold tracking-wider">STUDENTS</div>
            <a href="#" class="flex items-center px-2 py-2 hover:bg-white/5 rounded mb-1 text-gray-300 transition-colors"><i class="fa-regular fa-clipboard w-6"></i> Admission Enquiry</a>
            
            <!-- ACTIVE STUDENTS RECORD PAGE -->
            <a href="students.html" class="flex items-center px-2 py-2 bg-[#00c3a2] text-white rounded mb-1 font-medium transition-colors shadow-md"><i class="fa-solid fa-users w-6"></i> All Students</a>
            
            <!-- LINKED TO ADMISSION PAGE -->
            <a href="admission.html" class="flex items-center px-2 py-2 hover:bg-white/5 rounded mb-1 text-gray-300 transition-colors"><i class="fa-solid fa-user-plus w-6"></i> New Admission</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT - STUDENTS RECORD -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto">
        <!-- Header -->
        <header class="bg-white px-8 py-5 flex justify-between items-center sticky top-0 z-10 shadow-sm border-b border-gray-100">
            <div>
                <h2 class="text-2xl font-bold text-[#102a43]">Students Record</h2>
            </div>
            <div class="flex items-center gap-4">
                <a href="admission.html" class="bg-[#00c3a2] hover:bg-[#00a68d] text-white px-5 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow-md">
                    <i class="fa-solid fa-plus"></i> Add New Student
                </a>
            </div>
        </header>

        <div class="p-8">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                
                <!-- Table Toolbar (Search & Filter) -->
                <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <div class="relative w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Search by name or Adm No..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#00c3a2]">
                    </div>
                    <button class="border border-gray-300 text-gray-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 transition"><i class="fa-solid fa-filter mr-2"></i> Filter</button>
                </div>

                <!-- Data Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[800px]">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-[11px] uppercase tracking-wider border-b border-gray-200">
                                <th class="p-4 font-semibold">Adm No</th>
                                <th class="p-4 font-semibold">Student Name</th>
                                <th class="p-4 font-semibold">Class</th>
                                <th class="p-4 font-semibold">Father's Name</th>
                                <th class="p-4 font-semibold">Mobile No</th>
                                <th class="p-4 font-semibold text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody" class="text-sm text-gray-700">
                            <!-- Loading State Row (Jab tak data load na ho) -->
                            <tr id="loadingRow">
                                <td colspan="6" class="p-12 text-center text-gray-400">
                                    <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-[#00c3a2]"></i>
                                    <p>Fetching students data from database...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination (UI only) -->
                <div class="p-4 border-t border-gray-100 flex justify-between items-center bg-gray-50/50 text-xs text-gray-500">
                    <span id="totalStudentsCount">Showing 0 students</span>
                    <div class="flex gap-1">
                        <button class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-100 disabled:opacity-50">Prev</button>
                        <button class="px-3 py-1 bg-[#00c3a2] text-white rounded">1</button>
                        <button class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-100 disabled:opacity-50">Next</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- JAVASCRIPT: SUPABASE DATA FETCHING LOGIC -->
    <script>
        // 1. Supabase Connection
        const supabaseUrl = 'https://kngxrrcegwkwsfhesoom.supabase.co'; // Aapka project URL
        const supabaseKey = 'YAHAN_APNI_ANON_KEY_PASTE_KAREIN'; // APNI API KEY YAHAN DALEIN
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const tableBody = document.getElementById('studentsTableBody');
        const countDisplay = document.getElementById('totalStudentsCount');

        // 2. Fetch Data Function
        async function loadStudents() {
            try {
                // Supabase se data mangwana, sabse naya admission pehle dikhega (order by id descending)
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                // Loading animation hatana
                tableBody.innerHTML = '';

                // Agar database khali hai
                if (data.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="p-12 text-center text-gray-400">
                                <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 border border-gray-100">
                                    <i class="fa-solid fa-folder-open text-2xl text-gray-300"></i>
                                </div>
                                <p class="text-base font-semibold text-gray-600 mb-1">No Records Found</p>
                                <p class="text-xs">You haven't admitted any students yet.</p>
                                <a href="admission.html" class="inline-block mt-4 text-[#00c3a2] hover:underline font-medium"><i class="fa-solid fa-plus mr-1"></i> Add your first student</a>
                            </td>
                        </tr>
                    `;
                    countDisplay.textContent = `Showing 0 students`;
                    return;
                }

                // Database mein se ek-ek student ka data table row mein dalna
                data.forEach(student => {
                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-gray-50 text-gray-700';
                    
                    // Name ka pehla akshar nikalna profile icon ke liye
                    const initial = student.student_name ? student.student_name.charAt(0).toUpperCase() : 'U';

                    tr.innerHTML = `
                        <td class="p-4 font-medium text-gray-800">${student.adm_no || '-'}</td>
                        <td class="p-4 flex items-center gap-3 font-semibold">
                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0">${initial}</div>
                            ${student.student_name || 'N/A'}
                        </td>
                        <td class="p-4 text-gray-600"><span class="bg-gray-100 px-2 py-1 rounded text-xs font-medium border border-gray-200">${student.class_name || '-'}</span></td>
                        <td class="p-4 text-gray-600">${student.father_name || '-'}</td>
                        <td class="p-4 text-gray-600">${student.mobile_no || '-'}</td>
                        <td class="p-4 text-center">
                            <button class="text-blue-500 hover:text-blue-700 hover:bg-blue-50 w-8 h-8 rounded-full transition"><i class="fa-regular fa-pen-to-square"></i></button>
                            <button class="text-red-400 hover:text-red-600 hover:bg-red-50 w-8 h-8 rounded-full transition ml-1"><i class="fa-regular fa-trash-can"></i></button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                // Update Total Count
                countDisplay.textContent = `Showing ${data.length} student(s)`;

            } catch (error) {
                console.error("Error fetching data:", error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="p-8 text-center text-red-500">
                            <i class="fa-solid fa-triangle-exclamation mb-2 text-xl"></i>
                            <p>Failed to load data. Please check your Supabase API Key and internet connection.</p>
                            <p class="text-xs text-gray-400 mt-1">${error.message}</p>
                        </td>
                    </tr>
                `;
            }
        }

        // Page load hote hi data mangwana shuru karein
        window.addEventListener('DOMContentLoaded', loadStudents);
    </script>
</body>
</html>
