<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance - Student Portal</title>

    <!-- 🔒 SECURITY AUTH GUARD 🔒 -->
    <script>
        const sessionCheck = localStorage.getItem('school_user');
        if (!sessionCheck) window.location.replace('login.html');
        else {
            const user = JSON.parse(sessionCheck);
            if (user.role !== 'Student') { window.location.replace('login.html'); }
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    </style>
</head>
<body class="bg-[#f0f4f8] text-[#334e68] flex h-screen overflow-hidden antialiased">

    <!-- STUDENT SIDEBAR -->
    <aside class="w-64 bg-[#1e3a8a] text-white flex flex-col h-full overflow-y-auto hidden md:flex shrink-0 shadow-xl z-20 custom-scrollbar">
        <div class="p-4 flex items-center border-b border-white/10 sticky top-0 bg-[#1e3a8a] z-10">
            <div class="bg-white text-blue-800 w-10 h-10 rounded-lg flex items-center justify-center mr-3 shrink-0 shadow-inner">
                <i class="fa-solid fa-user-graduate text-xl"></i>
            </div>
            <div>
                <h1 class="text-[14px] font-extrabold leading-tight tracking-wider text-white uppercase">HIKVENA PVT.LTD</h1>
                <p class="text-[9px] text-blue-300 mt-0.5 font-bold uppercase tracking-widest">Student Portal</p>
            </div>
        </div>

        <div class="p-4 flex items-center border-b border-white/10">
            <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold mr-3 text-xs" id="sidebarInitial">S</div>
            <div>
                <h2 id="sidebarName" class="text-[12px] font-semibold text-white">Student Name</h2>
                <p class="text-[10px] text-blue-300 mt-0.5"><i class="fa-solid fa-id-badge text-[9px]"></i> <span id="sidebarAdmNo">Adm No</span></p>
            </div>
        </div>

        <nav class="flex-1 px-2 py-4 text-[13px] font-medium pb-10">
            <div class="mb-2 text-[10px] text-blue-300 font-bold tracking-wider uppercase px-3">DASHBOARD</div>
            <a href="student_dashboard.html" class="flex items-center px-4 py-2 hover:bg-white/10 rounded-md mb-1 text-gray-200 transition-colors"><i class="fa-solid fa-house w-6 text-sm"></i> My Home</a>

            <div class="mt-4 mb-2 text-[10px] text-blue-300 font-bold tracking-wider uppercase px-3">ACADEMICS</div>
            <a href="stu_attendance.html" class="flex items-center px-4 py-2 bg-blue-600 text-white rounded-md mb-0.5 shadow-sm"><i class="fa-regular fa-calendar-check w-6 text-sm"></i> My Attendance</a>
            <a href="stu_marks.html" class="flex items-center px-4 py-2 hover:bg-white/10 rounded-md mb-0.5 text-gray-200 transition-colors"><i class="fa-solid fa-ranking-star w-6 text-sm"></i> Exam Results</a>

            <div class="mt-4 mb-2 text-[10px] text-blue-300 font-bold tracking-wider uppercase px-3">FINANCE</div>
            <a href="stu_fees.html" class="flex items-center px-4 py-2 hover:bg-white/10 rounded-md mb-0.5 text-gray-200 transition-colors"><i class="fa-solid fa-file-invoice-dollar w-6 text-sm"></i> Fee Records</a>

            <div class="mt-4 mb-2 text-[10px] text-blue-300 font-bold tracking-wider uppercase px-3">SCHOOL UPDATES</div>
            <a href="stu_notices.html" class="flex items-center px-4 py-2 hover:bg-white/10 rounded-md mb-1 text-gray-200 transition-colors"><i class="fa-regular fa-bell w-6 text-sm"></i> Notice Board</a>

            <div class="mt-8 px-3 border-t border-white/10 pt-4">
                <a href="#" onclick="logoutUser()" class="flex items-center justify-center px-4 py-2.5 bg-red-500/20 hover:bg-red-500 rounded-md text-red-200 hover:text-white transition-all text-sm font-bold border border-red-500/30 shadow-sm">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Secure Logout
                </a>
            </div>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto bg-[#f4f7f6]">
        <header class="bg-white px-8 py-5 flex justify-between items-center sticky top-0 z-10 shadow-sm border-b border-gray-100">
            <div>
                <h2 class="text-2xl font-bold text-[#102a43]">My Attendance History</h2>
                <p class="text-xs text-gray-500 mt-1">Review your daily attendance records.</p>
            </div>
        </header>

        <div class="p-8 pt-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h3 class="text-[15px] font-bold text-gray-800"><i class="fa-regular fa-calendar-days mr-2 text-blue-600"></i> Attendance Log</h3>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-[#1e3a8a] text-white">
                            <tr class="text-[11px] uppercase tracking-wider">
                                <th class="p-4 font-semibold rounded-tl-md">Date</th>
                                <th class="p-4 font-semibold">Class</th>
                                <th class="p-4 font-semibold text-center rounded-tr-md">Status</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody" class="text-sm text-gray-700">
                            <tr><td colspan="3" class="p-8 text-center text-gray-400">Loading attendance...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://kngxrrcegwkwsfhesoom.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuZ3hycmNlZ3drd3NmaGVzb29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTgyMDcsImV4cCI6MjEwNTczNDIwN30.igoDWIfnRGTPhSA_RhU_gUOZEzK3TuVmttH_B4m7rIE';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        const userData = JSON.parse(localStorage.getItem('school_user'));
        if(userData) {
            document.getElementById('sidebarName').innerText = userData.name;
            document.getElementById('sidebarInitial').innerText = userData.name.charAt(0).toUpperCase();
            if(userData.username) document.getElementById('sidebarAdmNo').innerText = userData.username;
        }

        function logoutUser() {
            if(confirm("Logout?")) { localStorage.removeItem('school_user'); window.location.replace('login.html'); }
        }

        async function fetchAttendance() {
            if(!userData || !userData.username) return;
            try {
                const { data, error } = await db.from('attendance')
                    .select('*')
                    .eq('adm_no', userData.username)
                    .order('date', { ascending: false });

                const tbody = document.getElementById('attendanceTableBody');
                tbody.innerHTML = '';

                if (error || !data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-500">No attendance records found.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    let badge = `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Present</span>`;
                    if(item.status === 'Absent') badge = `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Absent</span>`;
                    if(item.status === 'Half Day') badge = `<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold uppercase">Half Day</span>`;

                    const d = new Date(item.date).toLocaleDateString('en-IN', {weekday:'short', year:'numeric', month:'short', day:'numeric'});
                    tbody.innerHTML += `
                        <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                            <td class="p-4 font-bold text-gray-800">${d}</td>
                            <td class="p-4 font-semibold text-gray-600">${item.class_name}</td>
                            <td class="p-4 text-center">${badge}</td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        window.addEventListener('DOMContentLoaded', fetchAttendance);
    </script>
</body>
</html>
