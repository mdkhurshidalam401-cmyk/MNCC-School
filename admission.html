<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Admission - School ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        aside::-webkit-scrollbar { width: 4px; }
        aside::-webkit-scrollbar-track { background: transparent; }
        aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        main::-webkit-scrollbar { width: 6px; }
        main::-webkit-scrollbar-track { background: #f0f4f8; }
        main::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .modal-active { display: flex !important; animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-[#f0f4f8] text-[#334e68] flex h-screen overflow-hidden antialiased">

    <!-- SIDEBAR (Image jaisa exact design) -->
    <aside class="w-64 bg-[#003126] text-white flex flex-col h-full overflow-y-auto hidden md:flex shrink-0 shadow-xl z-20">
        <div class="p-5 flex items-center border-b border-white/5 sticky top-0 bg-[#003126] z-10">
            <div class="bg-[#00927a] text-[#003126] w-10 h-10 rounded-lg flex items-center justify-center mr-3 shrink-0 shadow-inner">
                <i class="fa-solid fa-school text-xl"></i>
            </div>
            <div>
                <h1 class="text-[16px] font-bold leading-tight tracking-wide text-white">data click education</h1>
                <p class="text-[12px] text-[#8aa8a3] mt-0.5">Management System</p>
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 text-[14.5px] font-medium">
            <div class="mb-3 text-[12px] text-[#6b8f89] font-bold tracking-wider uppercase px-2">Main</div>
            <a href="index.html" class="flex items-center px-4 py-2.5 hover:bg-white/5 text-gray-200 rounded-md mb-6 transition-colors"><i class="fa-solid fa-house w-6 text-lg"></i> Dashboard</a>

            <div class="mb-3 text-[12px] text-[#6b8f89] font-bold tracking-wider uppercase px-2">Students</div>
            <a href="#" class="flex items-center px-4 py-2.5 hover:bg-white/5 rounded-md mb-1 text-gray-200 transition-colors"><i class="fa-regular fa-clipboard w-6 text-lg"></i> Admission Enquiry</a>
            <a href="students.html" class="flex items-center px-4 py-2.5 hover:bg-white/5 rounded-md mb-1 text-gray-200 transition-colors"><i class="fa-solid fa-users w-6 text-lg"></i> All Students</a>
            <!-- New Admission Active hai yahan -->
            <a href="admission.html" class="flex items-center px-4 py-2.5 bg-[#00c3a2] text-white rounded-md mb-1 shadow-sm"><i class="fa-solid fa-user-plus w-6 text-lg"></i> New Admission</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto">
        <header class="bg-white px-8 py-5 flex justify-between items-center sticky top-0 z-10 shadow-sm border-b border-gray-100">
            <div><h2 class="text-2xl font-bold text-[#102a43]">Register Student</h2></div>
            <a href="students.html" class="bg-[#e0fcf4] text-[#00c3a2] hover:bg-[#c9f9ec] transition-colors px-4 py-1.5 rounded-full text-xs font-semibold border border-[#b2f2e3]">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Students
            </a>
        </header>

        <div class="p-8 pt-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 flex-1">
                <form id="admissionForm" class="space-y-8">
                    <div>
                        <h3 class="text-[15px] font-bold text-gray-800 mb-4 flex items-center border-b border-gray-100 pb-2"><i class="fa-regular fa-id-card mr-2 text-[#00c3a2]"></i> Basic Information</h3>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="col-span-1">
                                <label class="block text-[11px] font-semibold text-gray-500 mb-1 uppercase">ADM NO</label>
                                <input type="text" id="admNo" value="ADM-26-1001" class="w-full border border-gray-300 rounded p-2 text-sm bg-gray-50 outline-none" readonly>
                            </div>
                            <div class="col-span-3">
                                <label class="block text-[11px] font-semibold text-gray-500 mb-1 uppercase">FULL NAME <span class="text-red-500">*</span></label>
                                <input type="text" id="studentName" required class="w-full border border-gray-300 rounded p-2 text-sm outline-none focus:border-[#00c3a2]">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[11px] font-semibold text-gray-500 mb-1 uppercase">FATHER'S NAME <span class="text-red-500">*</span></label>
                                <input type="text" id="fatherName" required class="w-full border border-gray-300 rounded p-2 text-sm outline-none focus:border-[#00c3a2]">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[11px] font-semibold text-gray-500 mb-1 uppercase">MOBILE NO <span class="text-red-500">*</span></label>
                                <input type="tel" id="mobileNo" required pattern="[0-9]{10}" maxlength="10" class="w-full border border-gray-300 rounded p-2 text-sm outline-none focus:border-[#00c3a2]">
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-[15px] font-bold text-gray-800 mb-4 flex items-center border-b border-gray-100 pb-2"><i class="fa-solid fa-graduation-cap mr-2 text-[#00c3a2]"></i> Class</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="col-span-2">
                                <label class="block text-[11px] font-semibold text-gray-500 mb-1 uppercase">CLASS <span class="text-red-500">*</span></label>
                                <select id="classSelect" required class="w-full border border-gray-300 rounded p-2 text-sm outline-none focus:border-[#00c3a2]">
                                    <option value="">Select Class</option>
                                    <option value="Class 1">Class 1</option>
                                    <option value="Class 2">Class 2</option>
                                    <option value="Class 3">Class 3</option>
                                    <option value="Class 4">Class 4</option>
                                    <option value="Class 5">Class 5</option>
                                    <option value="Class 10">Class 10</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 pt-4 border-t border-gray-100">
                        <button type="submit" id="registerBtn" class="bg-[#00c3a2] hover:bg-[#00a68d] text-white px-8 py-2.5 rounded text-sm font-semibold transition flex items-center gap-2">
                            <i class="fa-solid fa-user-plus"></i> Save Record
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- SUCCESS MODAL -->
    <div id="successModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full text-center">
            <div class="w-16 h-16 bg-[#e0fcf4] rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-check text-3xl text-[#00c3a2]"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Saved!</h2>
            <p class="text-gray-600 text-sm mb-6">Student added successfully to the database.</p>
            <a href="students.html" class="bg-[#003126] text-white px-6 py-2 rounded-lg font-semibold inline-block">View Records</a>
            <button id="closeModalBtn" class="ml-2 text-gray-500 underline text-sm hover:text-gray-700">Add another</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://kngxrrcegwkwsfhesoom.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuZ3hycmNlZ3drd3NmaGVzb29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNTgyMDcsImV4cCI6MjEwNTczNDIwN30.igoDWIfnRGTPhSA_RhU_gUOZEzK3TuVmttH_B4m7rIE';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('admissionForm');
        const modal = document.getElementById('successModal');
        const registerBtn = document.getElementById('registerBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            registerBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            registerBtn.disabled = true;

            const name = document.getElementById('studentName').value;
            const father = document.getElementById('fatherName').value;
            const studentClass = document.getElementById('classSelect').value;
            const admNo = document.getElementById('admNo').value;
            const mobile = document.getElementById('mobileNo').value;

            const { data, error } = await db.from('students').insert([
                { adm_no: admNo, student_name: name, father_name: father, class_name: studentClass, mobile_no: mobile }
            ]);

            if (error) {
                alert("Database Error: " + error.message);
                registerBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Save Record';
                registerBtn.disabled = false;
                return;
            }

            registerBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Save Record';
            registerBtn.disabled = false;
            modal.classList.add('modal-active');
            
            const currentNo = parseInt(admNo.split('-')[2]);
            document.getElementById('admNo').value = `ADM-26-${currentNo + 1}`;
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('modal-active');
            const currentAdmNo = document.getElementById('admNo').value;
            form.reset();
            document.getElementById('admNo').value = currentAdmNo;
        });
    </script>
</body>
</html>
