<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - School ERP Premium</title>
    <!-- Tailwind CSS CDN (Using a stable version) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            deepGreen: '#003126', // Richer sidebar green
                            accentTeal: '#00c3a2', // Vibrant, clean active color
                            formBorder: '#d9e2ec', // Clean form input border
                            formFocus: '#00c3a2',
                            lightBg: '#f0f4f8' // Very clean off-white background
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome for Icons (using modern solid icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Add font family reference -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom smooth scrollbar for sidebar */
        aside::-webkit-scrollbar {
            width: 5px;
        }
        aside::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        aside::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
        aside::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="bg-brand-lightBg text-[#334e68] flex h-screen overflow-hidden antialiased">

    <!-- SIDEBAR (More refined rich green) -->
    <aside class="w-72 bg-brand-deepGreen text-white flex flex-col h-full overflow-y-auto hidden md:flex transition-all duration-300">
        <!-- Logo Area with Subtle Gradient -->
        <div class="p-6 flex items-center border-b border-white/5 bg-gradient-to-b from-brand-deepGreen to-[#004c3e]">
            <div class="bg-white/10 text-brand-accentTeal p-2.5 rounded-lg mr-3 shadow-md"><i class="fa-solid fa-school text-xl"></i></div>
            <div class="flex-1">
                <h1 class="text-sm font-bold leading-tight tracking-tight">data click education</h1>
                <p class="text-[10px] text-teal-100 font-medium">Management System v1.5</p>
            </div>
            <button class="text-teal-200 md:hidden"><i class="fa-solid fa-times"></i></button>
        </div>

        <!-- User Profile -->
        <div class="p-5 flex items-center border-b border-white/5">
            <div class="w-10 h-10 rounded-full bg-teal-100 text-brand-deepGreen flex items-center justify-center font-semibold mr-3 shadow-inner">S</div>
            <div>
                <h2 class="text-sm font-semibold text-white">Super Administrator</h2>
                <p class="text-[11px] text-yellow-300"><i class="fa-solid fa-star-of-life mr-1 text-teal-300"></i> <span class="text-teal-200">Super Admin</span></p>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-teal-300 ml-auto"></i>
        </div>

        <!-- Navigation Menu -->
        <nav class="flex-1 px-3 py-6 text-[13px]">
            <div class="mb-3 text-[11px] text-teal-200 px-3 font-semibold tracking-wider uppercase opacity-70">MAIN</div>
             <a href="#" class="flex items-center px-3 py-2.5 hover:bg-[#004233] hover:text-white rounded-md mb-1.5 text-teal-50 group transition">
                <i class="fa-solid fa-chart-line w-6 text-teal-300 group-hover:text-white transition"></i> Dashboard
            </a>

            <div class="mt-6 mb-3 text-[11px] text-teal-200 px-3 font-semibold tracking-wider uppercase opacity-70">STUDENTS</div>
            <a href="#" class="flex items-center px-3 py-2.5 hover:bg-[#004233] hover:text-white rounded-md mb-1.5 text-teal-50 group transition">
                <i class="fa-solid fa-clipboard-question w-6 text-teal-300 group-hover:text-white transition"></i> Admission Enquiry
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 hover:bg-[#004233] hover:text-white rounded-md mb-1.5 text-teal-50 group transition">
                <i class="fa-solid fa-users w-6 text-teal-300 group-hover:text-white transition"></i> All Students
            </a>
            <!-- Active Menu with Accent Border -->
            <a href="#" class="flex items-center px-3 py-2.5 bg-brand-accentTeal text-white rounded-md mb-1.5 font-medium shadow-md group relative">
                <div class="absolute left-0 top-1/2 -translate-y-1/2 h-4 w-1 bg-white rounded-r-sm"></div>
                <i class="fa-solid fa-user-plus w-6 ml-1.5"></i> New Admission
            </a>
            
            <div class="mt-6 mb-3 text-[11px] text-teal-200 px-3 font-semibold tracking-wider uppercase opacity-70">FEES</div>
            <a href="#" class="flex items-center px-3 py-2.5 hover:bg-[#004233] hover:text-white rounded-md mb-1.5 text-teal-50 group transition">
                <i class="fa-solid fa-list w-6 text-teal-300 group-hover:text-white transition"></i> Fee Structure
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 hover:bg-[#004233] hover:text-white rounded-md mb-1.5 text-teal-50 group transition">
                <i class="fa-solid fa-money-bill-wave w-6 text-teal-300 group-hover:text-white transition"></i> Fee Collection
            </a>
        </nav>
        
        <!-- Sidebar Bottom Footer -->
        <div class="p-4 border-t border-white/5 bg-[#002a20] text-center text-xs text-teal-200">
            © 2026 MNCC-School. All rights reserved.
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto">
        
        <!-- Top Header (Title changed to Admin only) -->
        <header class="bg-white px-8 py-5 border-b border-[#e4e7eb] flex justify-between items-center sticky top-0 z-10 transition-all duration-300">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-gray-500 hover:text-brand-accentTeal"><i class="fa-solid fa-bars text-lg"></i></button>
                <h2 class="text-2xl font-bold text-[#102a43] leading-tight">Admin</h2>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-sm font-medium text-gray-600 border border-[#e4e7eb] px-4 py-1.5 rounded-full bg-white flex items-center shadow-inner gap-2"><i class="fa-regular fa-calendar-days text-brand-accentTeal"></i> Academic Year: <span class="font-bold">2027-28</span></div>
                <button class="bg-[#e0fcf4] hover:bg-[#bbf0e2] text-brand-accentTeal px-5 py-2 rounded-full text-xs font-semibold border border-[#b2f2e3] transition flex items-center gap-1.5"><i class="fa-solid fa-angle-left"></i> Back to Students</button>
            </div>
        </header>

        <!-- Form Container with More Padding -->
        <div class="p-10 transition-all duration-300 flex-1 flex flex-col">
            <form class="bg-white rounded-2xl shadow-xl shadow-brand-lightBg/10 border border-[#f0f4f8] p-10 flex-1 flex flex-col space-y-12">
                
                <!-- Section 1: Basic Information -->
                <div>
                    <h3 class="text-lg font-bold text-brand-deepGreen mb-6 flex items-center border-b border-[#e4e7eb] pb-3"><i class="fa-solid fa-user-tag mr-2.5 text-brand-accentTeal"></i> Basic Information</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <!-- Input Group -->
                        <div class="col-span-1">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">ADM NO <span class="text-red-500">*</span></label>
                            <input type="text" value="ADM-26-1022" class="w-full border border-brand-formBorder rounded-lg p-2.5 text-sm bg-[#fafcfd] focus:outline-none focus:border-brand-formFocus transition shadow-inner font-mono text-gray-600" readonly>
                        </div>
                        <div class="col-span-1 md:col-span-3">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">ADMISSION FORM NO (OPTIONAL)</label>
                            <input type="text" placeholder="e.g. FORM-26-1001" class="w-full border border-brand-formBorder rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-formFocus transition shadow-inner placeholder:text-gray-400">
                        </div>
                        
                        <div class="col-span-1 lg:col-span-4">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">FULL NAME <span class="text-red-500">*</span></label>
                            <input type="text" placeholder="Student full name" class="w-full border border-brand-formBorder rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-formFocus transition shadow-inner placeholder:text-gray-400">
                        </div>

                        <div class="col-span-1 lg:col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">FATHER'S NAME</label>
                            <input type="text" placeholder="Father's name" class="w-full border border-brand-formBorder rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-formFocus transition shadow-inner placeholder:text-gray-400">
                        </div>
                        <div class="col-span-1 lg:col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">MOTHER'S NAME</label>
                            <input type="text" placeholder="Mother's name" class="w-full border border-brand-formBorder rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-formFocus transition shadow-inner placeholder:text-gray-400">
                        </div>
                    </div>
                </div>

                <!-- Section 2: Class & Admission -->
                <div>
                    <h3 class="text-lg font-bold text-brand-deepGreen mb-6 flex items-center border-b border-[#e4e7eb] pb-3"><i class="fa-solid fa-graduation-cap mr-2.5 text-brand-accentTeal"></i> Class & Admission</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">CLASS <span class="text-red-500">*</span></label>
                            <select class="w-full border border-brand-formBorder rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-formFocus transition shadow-inner bg-white appearance-none text-gray-700">
                                <option>Select Class</option>
                                <option>Class 1</option>
                                <option>Class 2</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">SECTION</label>
                            <select class="w-full border border-brand-formBorder rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-formFocus transition shadow-inner bg-white appearance-none text-gray-700">
                                <option>Select</option>
                                <option>A</option>
                                <option>B</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">STATUS</label>
                            <select class="w-full border border-brand-formBorder rounded-lg p-2.5 text-sm focus:outline-none focus:border-brand-formFocus transition shadow-inner bg-white appearance-none text-gray-700">
                                <option>Active</option>
                                <option>Inactive</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons (Align bottom) -->
                <div class="flex items-center gap-5 pt-8 mt-auto border-t border-[#e4e7eb]">
                    <button type="button" class="bg-brand-accentTeal hover:bg-[#00a68d] text-white px-8 py-3 rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-brand-accentTeal/20"><i class="fa-solid fa-user-plus text-xs"></i> Register Student</button>
                    <button type="button" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-8 py-3 rounded-lg text-sm font-semibold transition flex items-center gap-1.5">Cancel Registration</button>
                </div>

            </form>
        </div>
    </main>
</body>
</html>
